<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101012"><meta name="description" content="MyFi – deine Musik und Community">
<link rel="manifest" href="manifest.webmanifest">
<title>MyFi</title>
<style>
:root{--a:#ff922b;--bg:#101012;--p:#1d1d22;--p2:#292930;--fg:#f7f7f8;--muted:#aaa;--line:#38383f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px system-ui,sans-serif}button,input,select,textarea{font:inherit}button{background:var(--a);color:#181818;border:0;border-radius:11px;padding:10px 14px;font-weight:700;cursor:pointer}button.alt{background:var(--p2);color:var(--fg);border:1px solid var(--line)}button.danger{background:#a83232;color:white}
header{height:64px;position:sticky;top:0;z-index:4;background:#101012ed;backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px}.logo{font-size:26px;font-weight:900}.logo span{color:var(--a)}
.shell{max-width:1180px;margin:auto;display:grid;grid-template-columns:210px 1fr;gap:20px;padding:20px 16px 120px}nav{display:flex;flex-direction:column;gap:7px}nav button{text-align:left;background:transparent;color:var(--muted)}nav button.on,nav button:hover{background:var(--p2);color:var(--fg)}main{min-width:0}h1{font-size:32px;margin:0 0 8px}h2{font-size:21px;margin:20px 0 10px}.muted,small{color:var(--muted)}.hero,.panel,.card{background:var(--p);border:1px solid var(--line);border-radius:17px;padding:16px}.hero{padding:25px;background:linear-gradient(125deg,#35231d,#22202d)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px}.cover{aspect-ratio:1;border-radius:12px;background:linear-gradient(135deg,var(--a),#523b68);display:grid;place-items:center;font-size:35px;margin-bottom:9px}.track{display:flex;align-items:center;gap:10px;padding:9px;border-radius:12px}.track:hover{background:var(--p2)}.track .cover{width:45px;flex:none;margin:0;font-size:20px}.grow{flex:1;min-width:0}.track b{display:block}.field{display:block;width:100%;padding:11px;margin:5px 0 12px;border:1px solid var(--line);border-radius:10px;background:var(--p2);color:var(--fg)}label{display:block;color:var(--muted);font-size:13px;margin-top:8px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{min-width:0}.between{justify-content:space-between}.hidden{display:none!important}.badge{color:#ff9c2c;font-weight:900}.pill{border:1px solid var(--a);color:var(--a);border-radius:30px;padding:3px 8px;font-size:11px}.player{position:fixed;bottom:0;left:0;right:0;z-index:5;background:#18181df2;border-top:1px solid var(--line);padding:10px 16px}.playerin{max-width:1180px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.player button{border-radius:50%;width:40px;height:40px;padding:0}.swatches button{width:33px;height:33px;border:2px solid white;padding:0;border-radius:50%}.notice{padding:10px;border-radius:10px;background:#322817;color:#ffdda8;font-size:13px}.tiny{font-size:12px}.list{display:grid;gap:7px}.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:720px){.shell{display:block;padding:12px 12px 145px}nav{position:fixed;bottom:62px;left:0;right:0;z-index:6;background:#17171bf5;border-top:1px solid var(--line);display:flex;flex-direction:row;justify-content:space-around;padding:5px;overflow:auto}nav button{font-size:11px;padding:8px 7px;white-space:nowrap}.player{padding:8px 12px}.playerin{gap:7px}.player .desktop{display:none}.split{grid-template-columns:1fr}h1{font-size:27px}}
</style></head>
<body>
<header><div class="logo">My<span>Fi</span> ♫</div><div class="row"><span class="pill">MYFI</span><button class="alt" onclick="go('settings')">⚙</button></div></header>
<div class="shell">
<nav id="nav">
<button class="on" data-p="home" onclick="go('home')">⌂ Start</button>
<button data-p="search" onclick="go('search')">⌕ Suche</button>
<button data-p="library" onclick="go('library')">▤ Bibliothek</button>
<button data-p="community" onclick="go('community')">♡ Community</button>
<button data-p="inbox" onclick="go('inbox')">✉ Nachrichten</button>
<button data-p="settings" onclick="go('settings')">⚙ Einstellungen</button>
</nav>
<main id="view"></main>
</div>
<div class="player"><div class="playerin"><div class="grow"><b id="playingTitle">Noch kein Titel</b><div class="muted tiny" id="playingArtist">MyFi Demo-Player</div></div><div class="row"><button class="alt" onclick="step(-1)">|◀</button><button onclick="playPause()" id="playBtn">▶</button><button class="alt" onclick="step(1)">▶|</button></div><div class="desktop muted tiny">Demo-Wiedergabe</div></div></div>
<div id="modal" class="hidden"></div>
<script>
const demo=[
["Morgenlicht","MyFi Studio","Pop","🌅"],["Neonregen","MyFi Studio","Electronic","🌃"],["Leichter Wind","MyFi Studio","Chill","🍃"],["Sternenstaub","MyFi Studio","Ambient","✨"],["Sommerfarben","MyFi Studio","Pop","🌈"],["Nachtzug","MyFi Studio","Electronic","🚆"],["Küstenweg","MyFi Studio","Chill","🌊"],["Goldene Stunde","MyFi Studio","Soul","🌇"],["Tanzfläche","MyFi Studio","Dance","🪩"],["Wolkenlos","MyFi Studio","Pop","☀️"],["Tiefblau","MyFi Studio","Ambient","🌌"],["Herzschlag","MyFi Studio","R&B","💗"],["Aufbruch","MyFi Studio","Indie","🚀"],["Regenbogen","MyFi Studio","Chill","🌈"],["Mitternacht","MyFi Studio","Jazz","🌙"],["Freier Fall","MyFi Studio","Electronic","🌀"],["Blütenzeit","MyFi Studio","Pop","🌸"],["Fernweh","MyFi Studio","Indie","🧭"],["Leuchtspur","MyFi Studio","Dance","💫"],["Zuhause","MyFi Studio","Acoustic","🏡"],
["Polarlicht","MyFi Studio","Ambient","❄️"],["Komet","MyFi Studio","Electronic","☄️"],["Kaffee am Morgen","MyFi Studio","Jazz","☕"],["Rosa Himmel","MyFi Studio","Chill","🌸"],["Stadtlichter","MyFi Studio","Pop","🏙️"],["Wellenreiter","MyFi Studio","Indie","🏄"],["Goldstaub","MyFi Studio","Soul","✨"],["Mondfahrt","MyFi Studio","Ambient","🌙"],["Sommernacht","MyFi Studio","Dance","🌴"],["Neuanfang","MyFi Studio","Pop","🌱"]];
let state={songs:demo.map((s,i)=>({id:"MF-"+String(i+1).padStart(4,"0"),title:s[0],artist:s[1],genre:s[2],emoji:s[3]})),favs:[],playlists:["Meine Favoriten"],users:[{name:"Du",verified:true,role:"Eigentümer",blocked:false},{name:"Alex",verified:false,role:"Mitglied",blocked:false},{name:"Mila",verified:true,role:"Mitglied",blocked:false}],messages:[{title:"Willkommen bei MyFi",body:"Schön, dass du dabei bist. Dies ist eine lokale Demo-Mitteilung.",date:new Date().toLocaleDateString()}],following:[],followers:[],settings:{accent:"#ff922b",theme:"dark",language:"de"},current:0};
let playing=false,adminUnlocked=false;
function persist(){localStorage.setItem("myfi-demo",JSON.stringify(state))}
function load(){try{let x=JSON.parse(localStorage.getItem("myfi-demo"));if(x)state={...state,...x}}catch(e){}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function go(p){document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.p===p));render(p)}
function rows(items){return items.map(s=>`<div class="track"><div class="cover">${esc(s.emoji||"♫")}</div><div class="grow"><b>${esc(s.title)}</b><small>${esc(s.artist)} · ${esc(s.genre)} · ${esc(s.id)}</small></div><button class="alt" onclick="playId('${esc(s.id)}')">▶</button><button class="alt" onclick="fav('${esc(s.id)}')">${state.favs.includes(s.id)?"♥":"♡"}</button></div>`).join("")||'<p class="muted">Noch nichts vorhanden.</p>'}
function render(p="home"){let v=document.getElementById("view"),s=state.songs,lang=state.settings.language;
if(p==="home")v.innerHTML=`<section class="hero"><span class="pill">MUSIC · COMMUNITY</span><h1>Dein Sound. Dein MyFi.</h1><p>Entdecke deine Musik, sammle Favoriten und finde deine Community.</p><button onclick="playId('${s[0]?.id||""}')">▶ Jetzt hören</button></section><h2>Entdecke Musik</h2><div class="grid">${s.slice(0,8).map(t=>`<div class="card"><div class="cover">${esc(t.emoji)}</div><b>${esc(t.title)}</b><small>${esc(t.artist)} · ${esc(t.genre)}</small><p><button onclick="playId('${esc(t.id)}')">Abspielen</button></p></div>`).join("")}</div><h2>Alle Demo-Titel · ${s.length}</h2><div class="list">${rows(s)}</div>`;
if(p==="search")v.innerHTML=`<h1>Suche</h1><input class="field" id="q" placeholder="Song, Künstler oder Genre suchen…" oninput="searchSongs()"><div id="searchRows" class="list">${rows(s)}</div>`;
if(p==="library")v.innerHTML=`<h1>Deine Bibliothek</h1><section class="panel"><h2>Favoriten</h2>${rows(s.filter(t=>state.favs.includes(t.id)))}</section><section class="panel"><h2>Playlists</h2>${state.playlists.map(x=>`<p>♫ ${esc(x)}</p>`).join("")}<button onclick="newPlaylist()">＋ Playlist erstellen</button></section>`;
if(p==="community")v.innerHTML=`<h1>MyFi Community</h1><p class="muted">Demo-Profile und lokale soziale Funktionen.</p><div class="grid">${state.users.filter(u=>!u.blocked).map(u=>`<div class="card"><div class="cover">☺</div><b>${esc(u.name)} ${u.verified?'<span class="badge">✓</span>':''}</b><small>${esc(u.role)}</small><p><button class="alt" onclick="follow('${esc(u.name)}')">${state.following.includes(u.name)?"Folge ich":"Folgen"}</button> <button class="alt" onclick="dm('${esc(u.name)}')">Nachricht</button></p></div>`).join("")}</div><div class="panel"><b>Deine Community-Zahlen</b><p>Du folgst: ${state.following.length} · Follower-Demo: ${state.followers.length}</p></div>`;
if(p==="inbox")v.innerHTML=`<h1>Nachrichten</h1><div class="list">${state.messages.map(m=>`<div class="panel"><b>${esc(m.title)}</b><p>${esc(m.body)}</p><small>${esc(m.date||"")}</small></div>`).join("")}</div><p class="muted tiny">Private Nachrichten sind in dieser Demo lokal und nicht mit anderen Geräten synchronisiert.</p>`;
if(p==="settings")v.innerHTML=`<h1>Einstellungen</h1><div class="panel"><h2>Design</h2><p>Akzentfarbe wählen</p><div class="row">${[["Orange","#ff922b"],["Rot","#e34c4c"],["Pink","#ed4d9a"],["Rosa","#f2a9c7"],["Lila","#9864df"],["Blau","#3986e8"],["Türkis","#17b8ad"],["Grün","#27a56b"],["Gold","#d4a52b"]].map(([n,c])=>`<button style="background:${c}" onclick="setAccent('${c}')">${n}</button>`).join("")}</div><label>Darstellung</label><select class="field" onchange="setTheme(this.value)"><option value="dark" ${state.settings.theme==="dark"?"selected":""}>Dunkel</option><option value="light" ${state.settings.theme==="light"?"selected":""}>Hell</option></select><label>Sprache</label><select class="field" onchange="state.settings.language=this.value;persist();render('settings')">${[["de","Deutsch"],["en","English"],["fr","Français"],["es","Español"],["it","Italiano"],["tr","Türkçe"],["pl","Polski"],["nl","Nederlands"],["pt","Português"],["ar","العربية"]].map(([k,n])=>`<option value="${k}" ${lang===k?"selected":""}>${n}</option>`).join("")}</select></div><div class="panel"><h2>Dein Profil</h2><label>Anzeigename</label><input id="profileName" class="field" value="${esc(state.users[0].name)}"><button onclick="saveProfile()">Profil speichern</button><h2>Datenschutz & Daten</h2><button class="alt" onclick="exportData()">Daten exportieren</button> <button class="danger" onclick="resetDemo()">Demo-Daten zurücksetzen</button></div><div class="panel"><h2>Eigentümer-Verwaltung</h2><p class="muted">Admin-Demo öffnen. Ein PIN im Browser ist nicht sicher genug für einen echten privaten Adminbereich.</p><button onclick="adminLogin()">Admin anmelden</button></div>`;
}
function searchSongs(){let q=document.getElementById("q").value.toLowerCase();document.getElementById("searchRows").innerHTML=rows(state.songs.filter(t=>(t.title+t.artist+t.genre+t.id).toLowerCase().includes(q)))}
function playId(id){let i=state.songs.findIndex(t=>t.id===id);if(i<0)return;state.current=i;playing=true;updatePlayer()}
function updatePlayer(){let t=state.songs[state.current];document.getElementById("playingTitle").textContent=t?.title||"Noch kein Titel";document.getElementById("playingArtist").textContent=t?.artist||"MyFi Demo";document.getElementById("playBtn").textContent=playing?"Ⅱ":"▶"}
function playPause(){playing=!playing;updatePlayer()}function step(d){if(!state.songs.length)return;state.current=(state.current+d+state.songs.length)%state.songs.length;playing=true;updatePlayer()}
function fav(id){state.favs=state.favs.includes(id)?state.favs.filter(x=>x!==id):[...state.favs,id];persist();render("library")}
function newPlaylist(){let n=prompt("Name der Playlist");if(n?.trim()){state.playlists.push(n.trim());persist();render("library")}}
function setAccent(c){state.settings.accent=c;document.documentElement.style.setProperty("--a",c);persist()}
function setTheme(t){state.settings.theme=t;let light=t==="light";for(let [k,v] of Object.entries(light?{"--bg":"#f4f4f6","--p":"#fff","--p2":"#e9e9ee","--fg":"#18181b","--muted":"#666","--line":"#ddd"}:{"--bg":"#101012","--p":"#1d1d22","--p2":"#292930","--fg":"#f7f7f8","--muted":"#aaa","--line":"#38383f"}))document.documentElement.style.setProperty(k,v);persist()}
function saveProfile(){let n=document.getElementById("profileName").value.trim();if(n){state.users[0].name=n;persist();alert("Profilname lokal gespeichert.")}}
function follow(n){state.following=state.following.includes(n)?state.following.filter(x=>x!==n):[...state.following,n];persist();render("community")}
function dm(n){let body=prompt("Nachricht an "+n);if(body?.trim()){state.messages.unshift({title:"Nachricht an "+n,body:body.trim(),date:new Date().toLocaleString()});persist();alert("In dieser Demo lokal vorgemerkt.")}}
function adminLogin(){let pin=prompt("Demo-Admin-PIN eingeben");if(pin==="1349"){adminUnlocked=true;renderAdmin()}else if(pin!==null)alert("Falscher Code.")}
function renderAdmin(){let v=document.getElementById("view");v.innerHTML=`<h1>MyFi · Admin-Dashboard</h1><div class="notice">Demo-Modus: Änderungen werden nur in diesem Browser gespeichert. Für echten exklusiven Adminzugriff sind Server, sichere Anmeldung und Datenbank erforderlich.</div><div class="grid"><div class="card"><b>${state.songs.length}</b><br><small>Songs</small></div><div class="card"><b>${state.users.length}</b><br><small>Demo-Nutzer</small></div><div class="card"><b>${state.messages.length}</b><br><small>Mitteilungen</small></div><div class="card"><b>${state.favs.length}</b><br><small>Favoriten</small></div></div>
<div class="split"><section class="panel"><h2>🎵 Song hinzufügen</h2><label>Titel</label><input id="at" class="field"><label>Künstler</label><input id="aa" class="field"><label>Genre</label><input id="ag" class="field"><label>Song-ID</label><input id="ai" class="field" placeholder="z. B. MYFI-1001"><button onclick="adminAddSong()">Song speichern</button><h2>Songbestand</h2><div class="list">${state.songs.map(t=>`<div class="track"><div class="grow"><b>${esc(t.title)}</b><small>${esc(t.id)} · ${esc(t.artist)}</small></div><button class="danger" onclick="deleteSong('${esc(t.id)}')">Löschen</button></div>`).join("")}</div></section>
<section class="panel"><h2>👥 Nutzer & Rollen</h2><label>Nutzername hinzufügen</label><input id="un" class="field" placeholder="Nutzername"><button onclick="addUser()">Nutzer hinzufügen</button>${state.users.map((u,i)=>`<div class="track"><div class="grow"><b>${esc(u.name)} ${u.verified?'<span class="badge">✓</span>':''}</b><small>${esc(u.role)} · ${u.blocked?"Gesperrt":"Aktiv"}</small></div><button class="alt" onclick="verify(${i})">${u.verified?"Haken weg":"Orange ✓"}</button><button class="alt" onclick="blockUser(${i})">${u.blocked?"Entsperren":"Sperren"}</button></div>`).join("")}
<h2>📣 Nachricht veröffentlichen</h2><input id="mt" class="field" placeholder="Überschrift"><textarea id="mb" class="field" placeholder="Nachricht an Nutzer"></textarea><button onclick="sendNotice()">Veröffentlichen</button>
<h2>🗂 Daten & Moderation</h2><button class="alt" onclick="exportData()">Daten exportieren</button> <button class="alt" onclick="importData()">Daten importieren</button><p class="muted tiny">Alben, Künstlerseiten, echte Follower und Moderationsmeldungen benötigen noch Backend-Datenmodelle.</p><button class="danger" onclick="adminUnlocked=false;go('home')">Adminbereich schließen</button></section></div>`}
function adminAddSong(){let title=document.getElementById("at").value.trim(),artist=document.getElementById("aa").value.trim(),genre=document.getElementById("ag").value.trim()||"Unsortiert",id=document.getElementById("ai").value.trim();if(!title||!artist||!id)return alert("Titel, Künstler und Song-ID sind erforderlich.");if(state.songs.some(t=>t.id===id))return alert("Song-ID ist bereits vergeben.");state.songs.push({id,title,artist,genre,emoji:"♫"});persist();renderAdmin()}
function deleteSong(id){if(confirm("Song "+id+" löschen?")){state.songs=state.songs.filter(t=>t.id!==id);persist();renderAdmin()}}
function addUser(){let n=document.getElementById("un").value.trim();if(!n)return;if(state.users.some(u=>u.name.toLowerCase()===n.toLowerCase()))return alert("Nutzer existiert bereits.");state.users.push({name:n,verified:false,role:"Mitglied",blocked:false});persist();renderAdmin()}
function verify(i){state.users[i].verified=!state.users[i].verified;persist();renderAdmin()}
function blockUser(i){state.users[i].blocked=!state.users[i].blocked;persist();renderAdmin()}
function sendNotice(){let title=document.getElementById("mt").value.trim(),body=document.getElementById("mb").value.trim();if(!title||!body)return alert("Bitte Überschrift und Nachricht eingeben.");state.messages.unshift({title,body,date:new Date().toLocaleString()});persist();alert("Mitteilung in der lokalen Demo veröffentlicht.");renderAdmin()}
function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="myfi-daten.json";a.click();URL.revokeObjectURL(a.href)}
function importData(){let f=document.createElement("input");f.type="file";f.accept="application/json";f.onchange=()=>{let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x.songs)||!Array.isArray(x.users))throw 0;state={...state,...x};persist();renderAdmin();alert("Daten importiert.")}catch(e){alert("Datei konnte nicht gelesen werden.")}};r.readAsText(f.files[0])};f.click()}
function resetDemo(){if(confirm("Alle lokal gespeicherten Demo-Daten zurücksetzen?")){localStorage.removeItem("myfi-demo");location.reload()}}
load();document.documentElement.style.setProperty("--a",state.settings.accent||"#ff922b");setTheme(state.settings.theme||"dark");go("home");
</script></body></html>
